<style type="text/css">

/*-------MUSIC PLAYER BY GLENTHEMES-------*/
#glenplayer02 { 
position:absolute; /* don't change the position */
top:15px;
margin-bottom:7px;
left:6px;
margin-left:20px;
display:flex;
z-index:100;
}
#glenplayer02 a {text-decoration:none;}
#glenplayer02 > div {
align-self:center;
-webkit-align-self:center;
}
.music-controls {
user-select:none;
-webkit-user-select:none;
width:13px;
font-size:40px;
cursor:pointer;
text-shadow: -1px 0 #DF01A5, 0 1px #DF01A5, 1px 0 #DF01A5, 0 -1px #DF01A5, 0 0;
}
.playy, .pausee {color:white;} /* color of play & pause buttons */
.pausee {display:none;}
.sonata {
margin-left:10px;
color:#222; /* color of music note symbol */
}
.labeltext {
margin-left:8px;
font-family:courier new;
font-size:9px;
color:#222; /* color of song title */
}
</style>
<body>

<!-------MUSIC PLAYER BY GLENTHEMES------->
<div id="glenplayer02">
<div class="music-controls" onclick="songstart();">

</div>
